<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Корпус камеры (стиль колонки) -->
  <rect x="14" y="22" width="36" height="20" rx="3" fill="#0077FF" />
  <rect x="14" y="22" width="36" height="20" rx="3" fill="url(#grad)" opacity="0.7" />

  <!-- Объектив -->
  <circle cx="32" cy="32" r="8" fill="#1A1A2E" />
  <circle cx="32" cy="32" r="4" fill="#00BFFF" />

  <!-- Кнопка записи -->
  <circle cx="50" cy="22" r="2" fill="#FF3B30" />

  <!-- Киноплёнка сверху и снизу -->
  <path d="M14 20 H50 M14 44 H50" stroke="#0077FF" stroke-width="2" stroke-dasharray="4 2" />

  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFFF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>
  </defs>
</svg>
